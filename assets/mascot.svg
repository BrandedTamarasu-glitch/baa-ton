<?xml version="1.0" encoding="UTF-8"?>
<!--
  Design: a soft-rounded pixel-art sheep assembled from friendly chunky tiles.
  Palette: oat #FFF0C9, indigo #35405E, lilac #A896FF, tangerine #FF9675.
  Baa-ton cue: blocky wool, ears, tail, and little feet make a playful sheep sprite.
  Contrast: colorful retro softness and rounded corners avoid a hard geometric logo.
  Use: high-contrast tile silhouettes read at 96px while staying razor crisp at 512px.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Baa-ton, the soft pixel sheep</title>
  <desc id="desc">A rounded pixel-art-inspired sheep sprite with lilac ears, an oat wool coat, and a happy face.</desc>

  <!-- chunky feet and tail, kept rounded so the sprite feels friendly -->
  <rect x="77" y="178" width="35" height="47" rx="10" fill="#A896FF" stroke="#35405E" stroke-width="7"/>
  <rect x="148" y="178" width="35" height="47" rx="10" fill="#A896FF" stroke="#35405E" stroke-width="7"/>
  <path d="M195 126h22c15 0 19 18 6 25l-20 10" fill="none" stroke="#FF9675" stroke-width="12" stroke-linecap="round"/>

  <!-- ears -->
  <rect x="55" y="66" width="43" height="65" rx="16" fill="#FF9675" stroke="#35405E" stroke-width="7" transform="rotate(-14 76 98)"/>
  <rect x="163" y="66" width="43" height="65" rx="16" fill="#FF9675" stroke="#35405E" stroke-width="7" transform="rotate(14 184 98)"/>
  <rect x="68" y="80" width="16" height="34" rx="8" fill="#FFD08A" transform="rotate(-14 76 97)"/>
  <rect x="174" y="80" width="16" height="34" rx="8" fill="#FFD08A" transform="rotate(14 182 97)"/>

  <!-- stepped wool tiles: a pixel silhouette with softened corners -->
  <rect x="70" y="61" width="42" height="42" rx="12" fill="#FFF0C9" stroke="#35405E" stroke-width="7"/>
  <rect x="106" y="51" width="45" height="45" rx="13" fill="#FFF0C9" stroke="#35405E" stroke-width="7"/>
  <rect x="145" y="63" width="42" height="42" rx="12" fill="#FFF0C9" stroke="#35405E" stroke-width="7"/>
  <rect x="53" y="91" width="151" height="93" rx="20" fill="#FFF0C9" stroke="#35405E" stroke-width="7"/>
  <rect x="63" y="105" width="26" height="26" rx="8" fill="#FFD66B"/>
  <rect x="168" y="105" width="26" height="26" rx="8" fill="#FFD66B"/>

  <!-- happy face -->
  <circle cx="108" cy="112" r="6" fill="#35405E"/>
  <circle cx="148" cy="112" r="6" fill="#35405E"/>
  <path d="M122 125q6 7 12 0" fill="none" stroke="#35405E" stroke-width="5" stroke-linecap="round"/>
</svg>
